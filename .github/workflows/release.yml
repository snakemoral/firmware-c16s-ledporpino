name: Release

# Quando o arquivo VERSION muda no main (ou ao rodar manualmente), cria a tag
# e a release com esse nome e anexa o UF2 da pasta firmware/.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir que o UF2 é reproduzível a partir do oficial
        run: |
          curl -sSL -o oficial.uf2 https://github.com/OpenStickCommunity/GP2040-CE/releases/download/v0.7.12/GP2040-CE_0.7.12_Haute42COSMOXMUltra.uf2
          python3 tools/build_ledporpino.py oficial.uf2 gerado.uf2
          cmp gerado.uf2 firmware/GP2040-CE_0.7.12_Haute42COSMOXMUltra_LedPorPino.uf2 || echo "::warning::UF2 gerado difere do versionado (versão da zlib?)"
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nada a fazer."
            exit 0
          fi
          gh release create "$TAG" firmware/*.uf2 \
            --target "$GITHUB_SHA" \
            --title "LED por pino ($TAG)" \
            --notes-file .github/release-notes.md
